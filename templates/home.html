{% extends "base.html" %}

{% block content %}
  <section class="intro">
    <p class="lead">{{ c.INTRO_LEAD }}</p>
    <p class="sub">{{ c.INTRO_SUB }}</p>
  </section>

  <section class="contact">
    <a href="mailto:{{ c.EMAIL }}">{{ c.EMAIL }}</a>
    {% for link in c.LINKS %}
      <a href="{{ link.url }}">{{ link.label }}</a>
    {% endfor %}
  </section>
{% endblock %}
