<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}pranav bhatia{% endblock %}</title>
  <meta name="description" content="{% block description %}pranav bhatia — senior software engineer in dallas, texas.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%234ade80'>▍</text></svg>">
</head>
<body>
  <div class="column">

    <nav aria-label="main">
      {% for endpoint, label, key in nav %}
        <a href="{{ url_for(endpoint) }}"
           class="nav-link{% if request.endpoint == endpoint %} is-current{% endif %}"
           data-key="{{ key }}"
           {% if request.endpoint == endpoint %}aria-current="page"{% endif %}>{{ label }} <span class="key">[{{ key }}]</span></a>
      {% endfor %}
    </nav>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer>
      <span>&copy; {{ c.YEAR }} pranav bhatia</span>
      <span>{{ c.LOCATION }}</span>
    </footer>

  </div>
  <script src="{{ url_for('static', filename='keys.js') }}" defer></script>
</body>
</html>
